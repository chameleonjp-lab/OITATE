name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit script tests
        run: npm run test:audit
      - name: Public build and license audit
        run: npm run audit:public
      - name: Upload P8 public audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-public-audit
          path: artifacts/p8-public-audit/
          if-no-files-found: error
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e
      - name: Preview browser health tests
        run: npm run e2e:preview
