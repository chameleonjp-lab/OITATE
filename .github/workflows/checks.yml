name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit script tests
        run: npm run test:audit
      - name: Public build and license audit
        env:
          P8_SOURCE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          P8_TESTED_MERGE_SHA: ${{ github.sha }}
        run: npm run audit:public
      - name: Upload P8 public audit
        if: ${{ always() && hashFiles('artifacts/p8-public-audit/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: p8-public-audit
          path: artifacts/p8-public-audit/
          if-no-files-found: error
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        run: npm run e2e
      - name: Preview browser health tests
        run: npm run e2e:preview
      - name: Generate P8 gameplay media
        env:
          P8_SOURCE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          P8_TESTED_MERGE_SHA: ${{ github.sha }}
        run: npm run capture:p8-media
      - name: Upload P8 gameplay media
        if: ${{ always() && hashFiles('artifacts/p8-gameplay-media/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: p8-gameplay-media
          path: artifacts/p8-gameplay-media
          if-no-files-found: error
